services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthome-postgres
    hostname: smarthome-postgres
    restart: always
    environment: 
       - POSTGRES_DB=smhome
       - POSTGRES_USER=smhome_user
       - POSTGRES_PASSWORD=smhome_user
    volumes:
        # seed tables in clean launch with init.sql script
      - ./smart_home/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./data/smart_home.db:/var/lib/postgresql/data
    ports:
        #host_port:container_port
      - 5433:5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smarthome-network

  temperature-api:
    image: ${DOCKER_REGISTRY-}server
    container_name: temperature-api
    restart: always
    environment: 
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8081
      - ASPNETCORE_HTTP_PORTS=8081

       #- ASPNETCORE_URLS=http://temperature-api:8081;https://temperature-api:8082
       #- HTTP_PORTS=8081
       #- HTTPS_PORTS=8082
    depends_on: 
      postgres:
        condition: service_healthy
    links:
      - "postgres"
    build:
      context: ./temperature-api
      dockerfile: Dockerfile
    ports:
       - "8081:8081"
    networks:
      - smarthome-network

  app:
    build:
      context: ./smart_home
      dockerfile: Dockerfile
    container_name: smarthome-app
    depends_on:
      postgres:
        condition: service_healthy
      temperature-api:
        condition: service_started
    environment:
      - DATABASE_URL=postgres://smhome_user:smhome_user@smarthome-postgres:5432/smarthome
      - TEMPERATURE_API_URL=http://temperature-api:8081
    ports:
      - "8080:8080"
    restart: unless-stopped
    networks:
      - smarthome-network

volumes:
  postgres_data: 

networks:
  smarthome-network:
    driver: bridge